<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Despensa y Menús</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Despensa">
  <link rel="apple-touch-icon" href="https://api.iconify.design/lucide:refrigerator.svg?color=%230f172a&width=180&height=180">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 1rem); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-28 select-none antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 py-3 shadow-xs">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-base sm:text-lg font-black tracking-tight text-slate-900 uppercase" id="view-title">
        Mi Despensa
      </h1>
      <span id="toast-aviso" class="text-xs font-bold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg transition-all opacity-0">
        Actualizado
      </span>
    </div>
  </header>

  <main class="w-full max-w-4xl mx-auto p-3 sm:p-5">
    
    <!-- VISTA 1: DESPENSA CON DICTADO -->
    <section id="view-stock" class="space-y-4">
      <div class="bg-white p-3 sm:p-4 rounded-2xl shadow-xs border border-slate-200 flex flex-col sm:flex-row gap-2">
        <div class="flex-1 flex gap-2">
          <input id="input-alimento" type="text" placeholder="Ej: Hamburguesas, Salmón... o usa el micro" 
                 class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-600 outline-none">
          
          <button type="button" id="btn-micro" onclick="activarDictado()" title="Dictar por voz"
                  class="w-11 h-11 bg-slate-100 hover:bg-slate-200 active:scale-90 text-slate-700 rounded-xl flex items-center justify-center font-bold transition shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 02-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
            </svg>
          </button>
        </div>
        
        <div class="flex gap-2">
          <div class="flex items-center bg-slate-50 border border-slate-200 rounded-xl px-2 shrink-0">
            <span class="text-xs font-bold text-slate-400 mr-1">Uds:</span>
            <input id="input-unidades" type="number" value="2" min="1" 
                   class="w-12 bg-transparent text-sm text-center font-black outline-none">
          </div>

          <button onclick="agregarAlimento()" 
                  class="flex-1 sm:flex-none bg-slate-900 active:scale-95 text-white px-5 py-2.5 rounded-xl text-sm font-bold shadow-xs transition">
            + Añadir
          </button>
        </div>
      </div>

      <div id="lista-alimentos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5"></div>
    </section>

    <!-- VISTA 2: MENÚ 15 DÍAS REVERSIBLE -->
    <section id="view-menu" class="hidden space-y-3">
      <div class="flex justify-between items-center px-1">
        <span class="text-xs text-slate-500 font-bold uppercase tracking-wider">Planificación 15 Días</span>
        <span class="text-xs text-slate-400">Pulsa para alternar Cocinada / Pendiente</span>
      </div>
      <div id="contenedor-dias" class="space-y-3"></div>
    </section>

    <!-- VISTA 3: COMPRA -->
    <section id="view-compra" class="hidden space-y-3">
      <div class="bg-white p-3 rounded-2xl shadow-xs border border-slate-200 flex gap-2">
        <input id="input-compra" type="text" placeholder="Añadir extra: Sal, Aceite, Café..." 
               class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2.5 text-sm outline-none">
        <button onclick="agregarItemCompra()" 
                class="bg-slate-900 active:scale-95 text-white px-4 py-2.5 rounded-xl text-sm font-bold shadow-xs">
          + Añadir
        </button>
      </div>

      <div class="flex justify-between items-center px-1">
        <span class="text-xs font-bold text-slate-600" id="conteo-compra">0 pendientes</span>
        <button onclick="limpiarComprados()" class="text-xs text-rose-600 font-bold active:underline">Borrar tachados</button>
      </div>

      <div id="lista-compra" class="space-y-2"></div>
    </section>

  </main>

  <!-- MODAL SELECTOR -->
  <div id="modal-selector" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 hidden flex items-end justify-center">
    <div class="bg-white rounded-t-3xl p-4 sm:p-6 w-full max-w-2xl max-h-[85vh] flex flex-col gap-3 shadow-2xl">
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <div>
          <h3 class="font-black text-slate-900 text-base" id="modal-titulo">Seleccionar Alimento</h3>
          <p class="text-xs text-slate-400">Toca para añadir al menú</p>
        </div>
        <button onclick="cerrarModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 font-bold flex items-center justify-center">✕</button>
      </div>
      
      <div id="modal-chips" class="flex flex-wrap gap-2 overflow-y-auto py-2"></div>

      <button onclick="cerrarModal()" class="w-full bg-slate-900 text-white py-3 rounded-xl font-bold text-sm active:scale-98">
        Listo
      </button>
    </div>
  </div>

  <!-- BARRA DE NAVEGACIÓN CON ICONOS -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 px-6 py-2 pb-safe flex justify-around items-center w-full max-w-4xl mx-auto shadow-lg z-40">
    <button onclick="cambiarVista('stock')" id="nav-stock" class="flex flex-col items-center gap-0.5 text-blue-600 text-xs font-black p-1 transition">
      <span class="text-2xl">🧊</span>
      <span class="text-[11px] tracking-tight">Despensa</span>
    </button>
    <button onclick="cambiarVista('menu')" id="nav-menu" class="flex flex-col items-center gap-0.5 text-slate-400 text-xs font-black p-1 transition">
      <span class="text-2xl">📅</span>
      <span class="text-[11px] tracking-tight">15 Días</span>
    </button>
    <button onclick="cambiarVista('compra')" id="nav-compra" class="flex flex-col items-center gap-0.5 text-slate-400 text-xs font-black p-1 transition">
      <span class="text-2xl">🛒</span>
      <span class="text-[11px] tracking-tight">Compra</span>
    </button>
  </nav>

  <script>
    let alimentos = [];
    let compra = [];
    let menus = {};
    let diaModal = null;
    let momentoModal = null;

    function avisar(texto) {
      const toast = document.getElementById('toast-aviso');
      toast.innerText = texto;
      toast.classList.remove('opacity-0');
      setTimeout(() => toast.classList.add('opacity-0'), 1500);
    }

    function cambiarVista(vista) {
      ['stock', 'menu', 'compra'].forEach(v => {
        document.getElementById(`view-${v}`).classList.add('hidden');
        document.getElementById(`nav-${v}`).classList.replace('text-blue-600', 'text-slate-400');
      });
      document.getElementById(`view-${vista}`).classList.remove('hidden');
      document.getElementById(`nav-${vista}`).classList.replace('text-slate-400', 'text-blue-600');

      const titulos = { stock: 'Mi Despensa', menu: 'Menú 15 Días', compra: 'Lista de la Compra' };
      document.getElementById('view-title').innerText = titulos[vista];
    }

    async function cargarTodo() {
      try {
        const [rStock, rCompra, rMenu] = await Promise.all([
          fetch('/api/alimentos'),
          fetch('/api/compra'),
          fetch('/api/menu')
        ]);
        alimentos = await rStock.json();
        compra = await rCompra.json();
        menus = await rMenu.json();

        renderizarStock();
        renderizarDias();
        renderizarCompra();
      } catch (err) {
        console.error("Error sincronizando:", err);
      }
    }

    // 1. VISTA DESPENSA
    function renderizarStock() {
      const cont = document.getElementById('lista-alimentos');
      if (!alimentos || alimentos.length === 0) {
        cont.innerHTML = '<div class="col-span-full text-center py-10 text-slate-400 text-sm">No hay alimentos. Añade el primero arriba o usa el micro.</div>';
        return;
      }
      cont.innerHTML = alimentos.map(item => `
        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 flex flex-col justify-between shadow-xs ${item.unidades > 0 ? '' : 'opacity-40 bg-slate-50'}">
          <div class="flex items-start justify-between gap-2">
            <span class="font-black text-sm text-slate-900 truncate">${item.nombre}</span>
            <button onclick="borrarAlimento('${item.id}')" class="text-slate-300 hover:text-rose-500 text-xs p-1">✕</button>
          </div>

          <div class="flex items-center justify-between mt-3 pt-2.5 border-t border-slate-100">
            <div class="flex items-center bg-slate-100 rounded-xl p-1 gap-2">
              <button onclick="modificarUnidades('${item.id}', -1)" class="w-7 h-7 bg-white rounded-lg font-black text-slate-700 active:scale-90 shadow-xs flex items-center justify-center">-</button>
              <span class="font-black text-xs text-slate-800 w-5 text-center">${item.unidades || 0}</span>
              <button onclick="modificarUnidades('${item.id}', 1)" class="w-7 h-7 bg-white rounded-lg font-black text-slate-700 active:scale-90 shadow-xs flex items-center justify-center">+</button>
            </div>
            
            <button onclick="mandarACompra('${item.nombre}')" title="Añadir a la lista" 
                    class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold active:scale-95 transition">
              + Compra
            </button>
          </div>
        </div>
      `).join('');
    }

    async function modificarUnidades(id, delta) {
      await fetch('/api/alimentos', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, delta })
      });
      avisar('Stock modificado');
      cargarTodo();
    }

    async function agregarAlimento() {
      const inputNom = document.getElementById('input-alimento');
      const inputUni = document.getElementById('input-unidades');
      const nombre = inputNom.value.trim();
      const unidades = parseInt(inputUni.value) || 1;
      if (!nombre) return;

      await fetch('/api/alimentos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre, unidades })
      });
      inputNom.value = '';
      avisar('Guardado');
      cargarTodo();
    }

    async function borrarAlimento(id) {
      await fetch('/api/alimentos', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      avisar('Eliminado');
      cargarTodo();
    }

    // 2. VISTA 15 DÍAS
    function renderizarDias() {
      const cont = document.getElementById('contenedor-dias');
      const diasSemana = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
      let html = '';

      const hoy = new Date();
      for (let i = 0; i < 15; i++) {
        const f = new Date();
        f.setDate(hoy.getDate() + i);
        const fechaStr = f.toISOString().split('T')[0];
        const diaNombre = i === 0 ? 'Hoy' : (i === 1 ? 'Mañana' : `${diasSemana[f.getDay()]} ${f.getDate()}`);

        const comida = menus[`${fechaStr}_comida`] || { items: [], consumido: false };
        const cena = menus[`${fechaStr}_cena`] || { items: [], consumido: false };

        html += `
          <div class="bg-white rounded-2xl p-3.5 sm:p-4 border border-slate-200 shadow-xs space-y-2.5">
            <div class="flex justify-between items-center border-b border-slate-100 pb-1.5">
              <span class="font-black text-sm ${i === 0 ? 'text-blue-600' : 'text-slate-800'}">${diaNombre}</span>
              <span class="text-[11px] font-semibold text-slate-400">${fechaStr}</span>
            </div>

            <!-- Comida -->
            <div class="p-2.5 rounded-xl border ${comida.consumido ? 'bg-emerald-50/60 border-emerald-200' : 'bg-slate-50/80 border-slate-200'} space-y-2 transition">
              <div class="flex items-center justify-between">
                <span class="text-xs font-black uppercase tracking-wider ${comida.consumido ? 'text-emerald-800' : 'text-slate-500'}">Comida</span>
                <div class="flex gap-1.5 items-center">
                  ${comida.items.length > 0 ? `
                    <button onclick="toggleConsumoDirecto('${fechaStr}', 'comida')" 
                            class="px-2.5 py-1 rounded-lg text-xs font-black transition active:scale-95 ${comida.consumido ? 'bg-emerald-600 text-white shadow-xs' : 'bg-white border border-slate-300 text-slate-600'}">
                      ${comida.consumido ? '✓ Cocinada' : 'Marcar cocinada'}
                    </button>
                  ` : ''}
                  <button onclick="abrirSelector('${fechaStr}', 'comida')" class="px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-700 active:scale-95">
                    + Añadir
                  </button>
                </div>
              </div>
              <div class="flex flex-wrap gap-1.5 min-h-6">
                ${comida.items.length === 0 ? '<span class="text-xs text-slate-400 italic">Sin asignar</span>' : ''}
                ${comida.items.map((it, idx) => `
                  <span class="inline-flex items-center gap-1.5 bg-white border border-slate-200 px-2.5 py-1 rounded-xl text-xs font-bold text-slate-800 shadow-2xs">
                    ${it.nombre}
                    ${!comida.consumido ? `<button onclick="quitarItemMenu('${fechaStr}', 'comida', ${idx})" class="text-slate-300 hover:text-rose-500 ml-1">✕</button>` : ''}
                  </span>
                `).join('')}
              </div>
            </div>

            <!-- Cena -->
            <div class="p-2.5 rounded-xl border ${cena.consumido ? 'bg-emerald-50/60 border-emerald-200' : 'bg-slate-50/80 border-slate-200'} space-y-2 transition">
              <div class="flex items-center justify-between">
                <span class="text-xs font-black uppercase tracking-wider ${cena.consumido ? 'text-emerald-800' : 'text-slate-500'}">Cena</span>
                <div class="flex gap-1.5 items-center">
                  ${cena.items.length > 0 ? `
                    <button onclick="toggleConsumoDirecto('${fechaStr}', 'cena')" 
                            class="px-2.5 py-1 rounded-lg text-xs font-black transition active:scale-95 ${cena.consumido ? 'bg-emerald-600 text-white shadow-xs' : 'bg-white border border-slate-300 text-slate-600'}">
                      ${cena.consumido ? '✓ Cocinada' : 'Marcar cocinada'}
                    </button>
                  ` : ''}
                  <button onclick="abrirSelector('${fechaStr}', 'cena')" class="px-2.5 py-1 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-700 active:scale-95">
                    + Añadir
                  </button>
                </div>
              </div>
              <div class="flex flex-wrap gap-1.5 min-h-6">
                ${cena.items.length === 0 ? '<span class="text-xs text-slate-400 italic">Sin asignar</span>' : ''}
                ${cena.items.map((it, idx) => `
                  <span class="inline-flex items-center gap-1.5 bg-white border border-slate-200 px-2.5 py-1 rounded-xl text-xs font-bold text-slate-800 shadow-2xs">
                    ${it.nombre}
                    ${!cena.consumido ? `<button onclick="quitarItemMenu('${fechaStr}', 'cena', ${idx})" class="text-slate-300 hover:text-rose-500 ml-1">✕</button>` : ''}
                  </span>
                `).join('')}
              </div>
            </div>

          </div>
        `;
      }
      cont.innerHTML = html;
    }

    function abrirSelector(fecha, momento) {
      diaModal = fecha;
      momentoModal = momento;
      document.getElementById('modal-titulo').innerText = `${momento.toUpperCase()} - ${fecha}`;
      const modal = document.getElementById('modal-selector');
      const contChips = document.getElementById('modal-chips');

      if (!alimentos || alimentos.length === 0) {
        contChips.innerHTML = '<div class="w-full text-slate-400 text-sm py-4 text-center">No hay alimentos en la despensa.</div>';
      } else {
        contChips.innerHTML = alimentos.map(a => `
          <button onclick="asignarAlimento('${a.id}', '${a.nombre}')" 
                  class="flex items-center gap-2 px-3 py-2 bg-slate-50 hover:bg-slate-100 border border-slate-200 rounded-xl text-xs font-bold text-slate-800 active:scale-95 transition">
            <span>${a.nombre}</span>
            <span class="text-[10px] px-1.5 py-0.5 bg-slate-200 rounded-md text-slate-600 font-black">${a.unidades}</span>
          </button>
        `).join('');
      }
      modal.classList.remove('hidden');
    }

    function cerrarModal() {
      document.getElementById('modal-selector').classList.add('hidden');
      diaModal = null;
      momentoModal = null;
    }

    async function asignarAlimento(id, nombre) {
      const clave = `${diaModal}_${momentoModal}`;
      if (!menus[clave]) menus[clave] = { items: [], consumido: false };
      
      menus[clave].items.push({ id, nombre });

      await fetch('/api/menu', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fecha: diaModal, momento: momentoModal, items: menus[clave].items, consumido: false })
      });

      avisar('Añadido');
      renderizarDias();
    }

    async function quitarItemMenu(fecha, momento, index) {
      const clave = `${fecha}_${momento}`;
      if (!menus[clave]) return;
      menus[clave].items.splice(index, 1);

      await fetch('/api/menu', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fecha, momento, items: menus[clave].items, consumido: false })
      });
      renderizarDias();
    }

    async function toggleConsumoDirecto(fecha, momento) {
      const clave = `${fecha}_${momento}`;
      const plato = menus[clave];
      if (!plato || plato.items.length === 0) return;

      const nuevoEstado = !plato.consumido;
      const delta = nuevoEstado ? -1 : 1;

      for (const it of plato.items) {
        if (it.id) {
          await fetch('/api/alimentos', {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: it.id, delta })
          });

          if (nuevoEstado) {
            const alimentoLocal = alimentos.find(a => a.id === it.id);
            if (alimentoLocal && (alimentoLocal.unidades + delta) <= 0) {
              await mandarACompra(it.nombre);
            }
          }
        }
      }

      plato.consumido = nuevoEstado;
      await fetch('/api/menu', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fecha, momento, items: plato.items, consumido: nuevoEstado })
      });

      avisar(nuevoEstado ? 'Menú cocinado (Stock -1)' : 'Desmarcado (Stock devuelto)');
      await cargarTodo();
    }

    // 3. VISTA COMPRA
    function renderizarCompra() {
      const cont = document.getElementById('lista-compra');
      const pendientes = compra.filter(c => !c.comprado);
      document.getElementById('conteo-compra').innerText = `${pendientes.length} pendientes`;

      if (compra.length === 0) {
        cont.innerHTML = '<div class="text-center py-12 text-slate-400 text-sm">Lista de compra vacía.</div>';
        return;
      }

      cont.innerHTML = compra.map(item => `
        <div class="bg-white p-3 rounded-2xl border border-slate-200 flex justify-between items-center shadow-xs">
          <label class="flex items-center gap-3 flex-1 cursor-pointer min-w-0">
            <input type="checkbox" ${item.comprado ? 'checked' : ''} onchange="toggleCompra('${item.id}', this.checked)"
                   class="w-5 h-5 text-blue-600 rounded-lg border-slate-300 shrink-0">
            <span class="text-sm font-bold truncate ${item.comprado ? 'line-through text-slate-400' : 'text-slate-800'}">${item.item}</span>
          </label>
          <button onclick="borrarCompra('${item.id}')" class="text-slate-300 hover:text-rose-500 text-sm p-1 ml-2 shrink-0">✕</button>
        </div>
      `).join('');
    }

    async function mandarACompra(item) {
      await fetch('/api/compra', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item })
      });
      avisar(`Añadido a la compra`);
      cargarTodo();
    }

    async function agregarItemCompra() {
      const input = document.getElementById('input-compra');
      const item = input.value.trim();
      if (!item) return;
      await fetch('/api/compra', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item })
      });
      input.value = '';
      avisar('Añadido a lista');
      cargarTodo();
    }

    async function toggleCompra(id, comprado) {
      await fetch('/api/compra', {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, comprado: comprado ? 1 : 0 })
      });
      cargarTodo();
    }

    async function borrarCompra(id) {
      await fetch('/api/compra', {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      avisar('Eliminado de lista');
      cargarTodo();
    }

    async function limpiarComprados() {
      await fetch('/api/compra-limpiar', { method: 'POST' });
      avisar('Lista limpiada');
      cargarTodo();
    }

 // 4. DICTADO POR VOZ ROBUSTO
    const numerosTexto = {
      'un': 1, 'uno': 1, 'una': 1,
      'dos': 2, 'tres': 3, 'cuatro': 4,
      'cinco': 5, 'seis': 6, 'siete': 7,
      'ocho': 8, 'nueve': 9, 'diez': 10
    };

    function activarDictado() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        avisar('Micro no soportado');
        return;
      }

      // Crear instancia limpia en cada pulsación para evitar bloqueos
      const rec = new SpeechRecognition();
      rec.lang = 'es-ES';
      rec.continuous = false;
      rec.interimResults = false;

      const btn = document.getElementById('btn-micro');

      rec.onstart = () => {
        btn.classList.add('bg-rose-600', 'text-white', 'animate-pulse');
        avisar('Escuchando...');
      };

      rec.onend = () => {
        btn.classList.remove('bg-rose-600', 'text-white', 'animate-pulse');
      };

      rec.onerror = (e) => {
        console.error("Error dictado:", e);
        btn.classList.remove('bg-rose-600', 'text-white', 'animate-pulse');
        if (e.error === 'not-allowed') {
          avisar('Permiso micro denegado');
        } else {
          avisar('No se captó audio');
        }
      };

      rec.onresult = async (evento) => {
        const transcripcion = evento.results[0][0].transcript.trim().toLowerCase();
        const palabras = transcripcion.split(' ');
        let unidadesDetectadas = null;

        if (numerosTexto[palabras[0]]) {
          unidadesDetectadas = numerosTexto[palabras[0]];
          palabras.shift();
        } else if (!isNaN(parseInt(palabras[0]))) {
          unidadesDetectadas = parseInt(palabras[0]);
          palabras.shift();
        }

        const inputUni = document.getElementById('input-unidades');
        const inputNom = document.getElementById('input-alimento');

        if (unidadesDetectadas) {
          inputUni.value = unidadesDetectadas;
        }

        const textoFinal = palabras.join(' ');
        inputNom.value = textoFinal.charAt(0).toUpperCase() + textoFinal.slice(1);
        
        avisar('Reconocido y guardando...');
        
        // Guarda directamente en la base de datos sin obligarte a tocar otro botón
        await agregarAlimento();
      };

      try {
        rec.start();
      } catch (err) {
        console.error(err);
        btn.classList.remove('bg-rose-600', 'text-white', 'animate-pulse');
      }
    }
      reconocimiento.start();
    }

    cargarTodo();
  </script>
</body>
</html>
